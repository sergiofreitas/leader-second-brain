# Second Brain — Generic Startup Configuration
# Hybrid: local for transcription/OCR/embedding, cloud for VLM/LLM

profile: generic

storage:
  sqlite:
    path: "~/.second-brain/memoria.db"
  media:
    path: "~/.second-brain/media/"
    max_size_mb: 2000
    retention_days: 180

providers:
  # The MCP host transcribes, describes and extracts entities
  transcription: "host"
  ocr: "host"
  vlm: "host"
  llm: "host"

  # Semantic search with OpenAI embeddings: memory text is sent to OpenAI
  embedding:
    provider: openai
    model: "text-embedding-3-small"
    api_key: "${OPENAI_API_KEY}"

transport:
  type: stdio

graph:
  engine: sqlite

skills:
  second_brain: true
  one_on_one: false
  pdi_gap_map: false
  feedback: true

feedback:
  format: freeform
  categories:
    - { id: "general", label: "Feedback geral" }
  items_per_category: 0
  target_system: markdown
