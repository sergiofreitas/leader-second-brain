# Second Brain — Personal Configuration
# Minimal setup for single-user personal use

profile: personal

storage:
  sqlite:
    path: "~/.second-brain/memoria.db"
  media:
    path: "~/.second-brain/media/"
    max_size_mb: 1000
    retention_days: 90

providers:
  # The MCP host transcribes, describes and extracts entities
  transcription: "host"
  ocr: "host"
  vlm: "host"
  llm: "host"

  # Semantic search with a local model served by Ollama: nothing leaves the
  # machine. Run `ollama pull bge-m3` first (multilingual, ~1.2 GB).
  embedding:
    provider: ollama
    model: "bge-m3"

transport:
  type: stdio

graph:
  engine: sqlite

feedback:
  format: freeform
  categories:
    - { id: "general", label: "Feedback" }
  items_per_category: 0
  target_system: markdown

skills:
  second_brain: true
  one_on_one: false
  pdi_gap_map: false
  feedback: false
