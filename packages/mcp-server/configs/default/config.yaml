# Second Brain — Default Configuration
# CGO-free, local-first, zero external dependencies

profile: default

storage:
  sqlite:
    path: "~/.second-brain/memoria.db"
  media:
    path: "~/.second-brain/media/"
    max_size_mb: 5000
    retention_days: 365

providers:
  # The MCP host transcribes, describes and extracts entities
  transcription: "host"
  ocr: "host"
  vlm: "host"
  llm: "host"

  # Semantic search is off by default: nothing is sent anywhere and search
  # is by keyword. To turn it on, pick a provider (see docs/configuration.md):
  #   embedding: { provider: ollama, model: bge-m3 }                     # local
  #   embedding: { provider: openai, api_key: "${OPENAI_API_KEY}" }      # cloud
  embedding: none

transport:
  type: stdio

graph:
  engine: sqlite  # graph tables + recursive CTEs in the same SQLite file (CGO-free)

skills:
  second_brain: true
  one_on_one: true
  pdi_gap_map: true
  feedback: true

feedback:
  format: stop_start_continue
  categories:
    - { id: "stop", label: "Parar de fazer", color: "#d97757" }
    - { id: "start", label: "Começar a fazer", color: "#788c5d" }
    - { id: "continue", label: "Continuar fazendo", color: "#6a9bcc" }
  items_per_category: 2
  target_system: markdown
