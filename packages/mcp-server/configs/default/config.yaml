# Second Brain — Default Configuration
# CGO-free, local-first, zero external dependencies

profile: default

storage:
  sqlite:
    path: "~/.second-brain/memoria.db"
  media:
    path: "~/.second-brain/media/"
    max_size_mb: 5000
    retention_days: 365

providers:
  # Default: local providers (zero API keys, works offline)
  transcription: "local:whisper"
  ocr: "local:tesseract"
  vlm: "local:ollama"
  embedding: "local:sentence_transformers"
  llm: "local:ollama"

  local:
    whisper:
      model: "base"           # tiny | base | small | medium | large
      device: "cpu"            # cpu | cuda | metal
    tesseract:
      language: "por"          # ISO 639-2
    sentence_transformers:
      model: "all-MiniLM-L6-v2"
      device: "cpu"
      dimensions: 384
    ollama:
      endpoint: "http://localhost:11434"
      models:
        llm: "llama3.2"
        vlm: "llava"

transport:
  type: stdio

graph:
  engine: sqlite  # graph tables + recursive CTEs in the same SQLite file (CGO-free)

skills:
  second_brain: true
  one_on_one: true
  pdi_gap_map: true
  feedback: true

feedback:
  format: stop_start_continue
  categories:
    - { id: "stop", label: "Parar de fazer", color: "#d97757" }
    - { id: "start", label: "Começar a fazer", color: "#788c5d" }
    - { id: "continue", label: "Continuar fazendo", color: "#6a9bcc" }
  items_per_category: 2
  target_system: markdown
