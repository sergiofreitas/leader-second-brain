name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { os: linux, arch: amd64, ext: "" }
          - { os: linux, arch: arm64, ext: "" }
          - { os: darwin, arch: amd64, ext: "" }
          - { os: darwin, arch: arm64, ext: "" }
          - { os: windows, arch: amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/mcp-server/go.mod
          cache-dependency-path: packages/mcp-server/go.sum

      - name: Build binary
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: 0
        run: |
          cd packages/mcp-server
          go build -o ../../dist/second-brain-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.ext }} ./cmd/second-brain

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: second-brain-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: dist/second-brain-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
